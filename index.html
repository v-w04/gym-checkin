<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GYM CHECK-IN · Electronics México</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23181818'/><circle cx='50' cy='50' r='42' fill='%23da291c'/><text y='1.1em' x='50' font-size='45' text-anchor='middle' font-family='sans-serif' fill='white' font-weight='bold'>G</text></svg>">
<meta name="theme-color" content="#da291c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Check-in">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #181818; --canvas-elevated: #303030;
    --primary: #da291c; --primary-active: #b01e0a;
    --ink: #ffffff; --body-color: #969696; --muted: #666666;
    --hairline: #303030; --on-primary: #ffffff;
    --success: #03904a; --warning-color: #f13a2c;
    --sp-xxs:8px; --sp-xs:16px; --sp-sm:24px; --sp-md:32px; --sp-lg:48px; --sp-xl:64px; --sp-xxl:96px;
    --font: 'Inter', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100dvh; background: var(--canvas); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }

  .hero { position: relative; width: 100%; height: 35vh; min-height: 200px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .hero-bg { position: absolute; inset: 0; background: linear-gradient(160deg, #0e0b0b 0%, #1e0f0c 40%, #241210 70%, #181818 100%); }
  .hero-bg::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(-55deg, transparent, transparent 48px, rgba(255,255,255,0.013) 48px, rgba(255,255,255,0.013) 49px); }
  .hero-bg::after { content: ''; position: absolute; bottom: -80px; right: -80px; width: 600px; height: 500px; background: radial-gradient(ellipse, rgba(218,41,28,0.22) 0%, transparent 62%); }
  .hero-number { position: absolute; top: 50%; right: -8px; transform: translateY(-55%); font-size: clamp(80px, 22vw, 320px); font-weight: 700; line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(218,41,28,0.12); letter-spacing: -0.04em; pointer-events: none; user-select: none; z-index: 1; }
  .nav { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-md); z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .nav-left { display: flex; align-items: center; gap: var(--sp-xxs); }
  .nav-icon { width: 28px; height: 28px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .nav-brand { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink); }
  .nav-tag { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }
  .hero-copy { position: relative; z-index: 5; padding: var(--sp-sm) var(--sp-md) var(--sp-xs); }
  .hero-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: var(--primary); margin-bottom: var(--sp-xxs); }
  .hero-h1 { font-size: clamp(26px, 6vw, 56px); font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); }
  .hero-line { position: absolute; left: var(--sp-md); bottom: 0; width: 1px; height: 48px; background: linear-gradient(180deg, var(--primary), transparent); z-index: 5; }

  .main { background: var(--canvas); padding: var(--sp-md) var(--sp-md) var(--sp-xl); position: relative; }
  .main-accent { width: 40px; height: 2px; background: var(--primary); margin-bottom: var(--sp-md); }
  .screen { display: none; }
  .screen.active { display: block; }

  .panel-label { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); margin-bottom: var(--sp-xs); }
  .panel { background: var(--canvas-elevated); border: 1px solid rgba(255,255,255,0.06); padding: var(--sp-md); }

  .pin-input { width: 100%; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 4px; padding: 14px 16px; color: var(--ink); font-family: var(--font); font-size: 22px; font-weight: 500; letter-spacing: 5px; text-align: center; outline: none; transition: border-color 0.15s; caret-color: var(--primary); -webkit-appearance: none; }
  .pin-input::placeholder { color: var(--muted); letter-spacing: 1px; font-size: 13px; }
  .pin-input:focus { border-color: var(--primary); }
  .field-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: var(--sp-xxs); margin-bottom: var(--sp-sm); }

  .btn { display: flex; align-items: center; justify-content: center; gap: var(--sp-xxs); width: 100%; height: 48px; padding: 0 var(--sp-md); border: none; border-radius: 0; font-family: var(--font); font-size: 14px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; cursor: pointer; transition: background 0.1s, opacity 0.1s; }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:active { background: var(--primary-active); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid rgba(255,255,255,0.18); font-size: 12px; letter-spacing: 1.1px; margin-top: var(--sp-xxs); }
  .btn-secondary:active { background: rgba(255,255,255,0.04); }

  .result { margin-top: var(--sp-sm); padding: var(--sp-xs) var(--sp-sm); display: none; border-left: 2px solid; }
  .result.ok    { border-color: var(--success);        background: rgba(3,144,74,0.07); }
  .result.warn  { border-color: #ffaa33;               background: rgba(255,170,51,0.07); }
  .result.error { border-color: var(--warning-color);  background: rgba(241,58,44,0.07); }
  .result-title { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; margin-bottom: 4px; }
  .result.ok    .result-title { color: #2ec97e; }
  .result.warn  .result-title { color: #ffaa33; }
  .result.error .result-title { color: var(--warning-color); }
  .result-msg { font-size: 13px; color: var(--body-color); line-height: 1.5; }

  .processing-box { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-md); background: var(--canvas-elevated); border: 1px solid rgba(255,255,255,0.06); margin-top: var(--sp-xs); }
  .proc-text { font-size: 14px; color: var(--muted); }
  .proc-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }

  .maps-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--primary); text-decoration: none; border-bottom: 1px solid rgba(218,41,28,0.3); padding-bottom: 1px; }

  .countdown-bar { height: 3px; background: var(--hairline); margin-top: var(--sp-sm); overflow: hidden; }
  .countdown-fill { height: 100%; background: var(--primary); width: 100%; transition: width 1s linear; }
  .countdown-txt { font-size: 11px; color: var(--muted); text-align: center; margin-top: var(--sp-xxs); letter-spacing: 0.08em; text-transform: uppercase; }

  .spin { width: 14px; height: 14px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--on-primary); border-radius: 50%; animation: rot 0.7s linear infinite; }
  .gps-dot { width: 8px; height: 8px; flex-shrink: 0; background: var(--on-primary); border-radius: 50%; position: relative; }

  .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: var(--sp-xs) var(--sp-md); border-top: 1px solid var(--hairline); background: var(--canvas); display: flex; align-items: center; justify-content: space-between; }
  .footer-text { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  .footer-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }

  @keyframes rot { to { transform: rotate(360deg); } }

  @media (min-width: 1024px) {
    .hero { position: fixed; top: 0; left: 0; width: 52%; height: 100dvh; }
    .hero-number { font-size: clamp(200px, 22vw, 340px); }
    .main { margin-left: 52%; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: var(--sp-xxl) var(--sp-xl) 100px; }
    .main-accent { display: none; }
    .footer { left: 52%; }
    .nav { padding: 0 var(--sp-xl); }
    .hero-copy { padding: var(--sp-xxl) var(--sp-xl) var(--sp-lg); }
    .hero-line { left: var(--sp-xl); }
  }

  /* ── Zoom controls — solo en PWA (standalone) ── */
  .zoom-controls {
    display: none;
    position: fixed;
    bottom: 72px;
    right: 16px;
    z-index: 999;
    flex-direction: column;
    gap: 8px;
  }

  /* Siempre visible */
  .zoom-controls { display: flex; }

  .zoom-btn {
    width: 40px;
    height: 40px;
    background: var(--canvas-elevated);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--ink);
    font-size: 20px;
    font-weight: 300;
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: background 0.1s;
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
  }

  .zoom-btn:active { background: var(--primary); }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-number">GYM</div>
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-icon">🏋️</div>
      <span class="nav-brand">Electronics México</span>
    </div>
    <span class="nav-tag">Uso interno</span>
  </nav>
  <div class="hero-copy">
    <p class="hero-eyebrow">Electronics México · Registro de asistencia</p>
    <h1 class="hero-h1">GYM<br>CHECK-IN</h1>
  </div>
  <div class="hero-line"></div>
</section>

<main class="main">
  <div class="main-accent"></div>

  <!-- LOGIN -->
  <div id="s-login" class="screen active">
    <div class="panel-label">Identificación</div>
    <div class="panel">
      <input class="pin-input" type="tel" id="pin" maxlength="10"
             placeholder="Tu PIN" inputmode="numeric" autocomplete="off"
             onkeydown="if(event.key==='Enter') doLogin()">
      <p class="field-hint">Tu PIN = 00 + tu número de empleado</p>
      <button class="btn btn-primary" id="btn-login" onclick="doLogin()">Entrar</button>
    </div>
    <div class="result" id="login-err">
      <div class="result-title">Error de acceso</div>
      <div class="result-msg" id="login-err-msg"></div>
    </div>
  </div>

  <!-- PROCESANDO -->
  <div id="s-processing" class="screen">
    <div class="processing-box">
      <div class="spin"></div>
      <div>
        <div class="proc-title">Procesando...</div>
        <div class="proc-text" id="proc-msg">Verificando...</div>
      </div>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="s-result" class="screen">
    <div class="result" id="checkin-result" style="display:block; margin-top:0">
      <div class="result-title" id="cr-title"></div>
      <div class="result-msg" id="cr-msg"></div>
      <a class="maps-link" id="cr-maps" href="#" target="_blank" style="display:none">
        📍 Ver ubicación en Maps
      </a>
    </div>

    <div class="countdown-bar" style="margin-top:12px; display:none" id="countdown-wrap">
      <div class="countdown-fill" id="countdown-fill"></div>
    </div>
    <p class="countdown-txt" id="countdown-txt"></p>
    <button class="btn btn-secondary" style="margin-top:16px" onclick="doLogout()">
      Volver al inicio
    </button>
  </div>

</main>

<footer class="footer">
  <span class="footer-text">v1.0 &nbsp;·&nbsp; Solo uso interno</span>
  <button id="btn-install" onclick="instalarApp()" style="
    display:block;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 0;
    padding: 6px 14px;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    cursor: pointer;
  ">⬇ Instalar app</button>
  <div class="footer-dot"></div>
</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwOXDMHVLtn9MHEKr3gKZuf_TyPUExLCy5TtEsv9EZvTi9LtzLac-IR7kNj2YEv00oR/exec";
  let session = null, _cbCount = 0;

  // ── Zoom PWA ──
  let _zoomLevel = parseFloat(localStorage.getItem("pwa_zoom") || "1");
  
  function aplicarZoom() {
    document.body.style.zoom = _zoomLevel;
    // Para Safari que no soporta zoom
    document.body.style.transform = "scale(" + _zoomLevel + ")";
    document.body.style.transformOrigin = "top left";
    document.body.style.width = (100 / _zoomLevel) + "%";
  }

  function cambiarZoom(dir) {
    _zoomLevel = Math.min(2, Math.max(0.7, _zoomLevel + dir * 0.1));
    _zoomLevel = Math.round(_zoomLevel * 10) / 10;
    localStorage.setItem("pwa_zoom", _zoomLevel);
    aplicarZoom();
  }

  // Aplicar zoom guardado al cargar
  if (window.matchMedia("(display-mode: standalone)").matches) {
    aplicarZoom();
  }

  function callAPI(action, params = {}) {
    return new Promise((resolve, reject) => {
      const cbName = "_cb" + (++_cbCount);
      const timeout = setTimeout(() => {
        delete window[cbName];
        document.getElementById("jsonp-" + cbName)?.remove();
        reject(new Error("Tiempo de espera agotado"));
      }, 25000);
      window[cbName] = (data) => {
        clearTimeout(timeout);
        delete window[cbName];
        document.getElementById("jsonp-" + cbName)?.remove();
        resolve(data);
      };
      const tag = document.createElement("script");
      tag.id = "jsonp-" + cbName;
      tag.src = API_URL + "?" + new URLSearchParams({ action, callback: cbName, ...params });
      tag.onerror = () => {
        clearTimeout(timeout);
        setTimeout(() => { if (window[cbName]) reject(new Error("Sin conexión")); }, 500);
      };
      document.head.appendChild(tag);
    });
  }

  async function doLogin() {
    const pin = document.getElementById("pin").value.trim();
    const btn = document.getElementById("btn-login");
    if (!pin) { showLoginErr("¡Hola! Ingresa tu PIN para comenzar 👋"); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Verificando...';
    document.getElementById("login-err").style.display = "none";
    try {
      const data = await callAPI("login", { pin });
      if (data.ok) {
        session = data;
        document.getElementById("emp-name-display") && (document.getElementById("emp-name-display").textContent = data.nombre);
        show("s-processing");
        doCheckinAuto();
      } else {
        showLoginErr(data.msg);
      }
    } catch(e) {
      showLoginErr("Sin conexión: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  }

  function doCheckinAuto() {
    if (!navigator.geolocation) {
      mostrarResultado("error", "GPS no disponible", "Tu dispositivo no puede detectar tu ubicación. Intenta desde otro celular.", null);
      return;
    }
    setProc("Detectando tu ubicación...");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        setProc("Ya casi, registrando tu visita...");
        try {
          const data = await callAPI("registrar", {
            pin: session.pin,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
          });
          if (data.ok) {
            mostrarResultado(data.primero ? "warn" : "ok",
              data.primero ? "¡Bienvenido al sistema! 🎉" : "¡Listo, ya quedaste registrado! 💪",
              data.msg, data.mapsUrl);
          } else {
            mostrarResultado("error", "Acércate un poco más", data.msg, null);
          }
        } catch(e) {
          mostrarResultado("error", "Sin conexión", e.message, null);
        }
      },
      (gpsErr) => {
        const msgs = { 1:"Permiso denegado. Actívalo en tu navegador.", 2:"No se pudo obtener ubicación. Intenta al aire libre.", 3:"Tiempo GPS agotado. Intenta de nuevo." };
        mostrarResultado("error", "GPS sin señal", msgs[gpsErr.code] || gpsErr.message, null);
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  function mostrarResultado(tipo, title, msg, mapsUrl) {
    const res        = document.getElementById("checkin-result");
    const mapsLink   = document.getElementById("cr-maps");
    const countWrap  = document.getElementById("countdown-wrap");

    res.className = "result " + tipo;
    document.getElementById("cr-title").textContent = title;
    document.getElementById("cr-msg").textContent   = msg;

    if (mapsUrl) { mapsLink.href = mapsUrl; mapsLink.style.display = "inline-flex"; }
    else { mapsLink.style.display = "none"; }

    show("s-result");

    if (tipo === "ok" || tipo === "warn") {
      countWrap.style.display = "block";
      let seg = 5;
      const fill = document.getElementById("countdown-fill");
      const txt  = document.getElementById("countdown-txt");
      fill.style.width = "100%";
      txt.textContent  = "Regresando en " + seg + "...";
      const iv = setInterval(() => {
        seg--;
        fill.style.width = (seg / 5 * 100) + "%";
        txt.textContent  = seg > 0 ? "Regresando en " + seg + "..." : "Regresando...";
        if (seg <= 0) { clearInterval(iv); doLogout(); }
      }, 1000);
    } else {
      countWrap.style.display = "none";
      document.getElementById("countdown-txt").textContent = "";
    }
  }

  function setProc(msg) { document.getElementById("proc-msg").textContent = msg; }

  function doLogout() {
    session = null;
    document.getElementById("pin").value = "";
    document.getElementById("login-err").style.display = "none";
    show("s-login");
  }

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function showLoginErr(msg) {
    const err = document.getElementById("login-err");
    err.className = "result error";
    err.querySelector(".result-title").textContent = "Ups, algo no coincide";
    err.querySelector(".result-msg").textContent   = msg;
    err.style.display = "block";
  }
</script>
<script>
  let _installPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    _installPrompt = e;
  });

  window.addEventListener("appinstalled", () => {
    _installPrompt = null;
  });

  async function instalarApp() {
    if (_installPrompt) {
      _installPrompt.prompt();
      await _installPrompt.userChoice;
      _installPrompt = null;
      return;
    }
    // iOS Safari — única opción real es share sheet
    if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
      mostrarModalInstall();
      return;
    }
    // Chrome — intentar abrir chrome://flags o usar share API
    if (navigator.share) {
      navigator.share({
        title: "Gym Check-in · Electronics México",
        url: window.location.href
      });
      return;
    }
    // Último recurso: mostrar modal con instrucciones visuales
    mostrarModalInstall();
  }

  function mostrarModalInstall() {
    // Crear modal de instrucciones visuales
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:0 0 20px";
    const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    overlay.innerHTML = `
      <div style="background:#1e293b;border:1px solid #334155;border-radius:16px 16px 0 0;padding:28px 24px;width:100%;max-width:420px;font-family:var(--font)">
        <div style="width:40px;height:4px;background:#475569;border-radius:2px;margin:0 auto 20px"></div>
        <div style="font-size:18px;font-weight:700;color:#f8fafc;margin-bottom:16px">Instalar app</div>
        ${esIOS ? `
          <div style="color:#94a3b8;font-size:14px;line-height:1.8">
            <div style="margin-bottom:10px">1. Toca <strong style="color:#f8fafc">compartir</strong> <span style="font-size:18px">⎙</span> en la barra inferior</div>
            <div style="margin-bottom:10px">2. Busca <strong style="color:#f8fafc">"Agregar a pantalla de inicio"</strong></div>
            <div>3. Toca <strong style="color:#da291c">Agregar</strong></div>
          </div>
        ` : `
          <div style="color:#94a3b8;font-size:14px;line-height:1.8">
            <div style="margin-bottom:10px">1. Toca el menú <strong style="color:#f8fafc">⋮</strong> arriba a la derecha</div>
            <div style="margin-bottom:10px">2. Selecciona <strong style="color:#f8fafc">"Agregar a pantalla de inicio"</strong></div>
            <div>3. Toca <strong style="color:#da291c">Agregar</strong></div>
          </div>
        `}
        <button onclick="this.closest('div[style]').remove()" style="margin-top:24px;width:100%;height:48px;background:#da291c;color:#fff;border:none;font-family:var(--font);font-size:14px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;border-radius:0">
          Entendido
        </button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  }
</script>
<!-- Zoom controls para PWA -->
<div class="zoom-controls" id="zoom-controls">
  <button class="zoom-btn" onclick="cambiarZoom(1)" title="Aumentar">+</button>
  <button class="zoom-btn" onclick="cambiarZoom(-1)" title="Reducir">−</button>
</div>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/gym-checkin/sw.js")
      .then(() => console.log("SW registrado"))
      .catch(e => console.log("SW error:", e));
  }
</script>
</body>
</html>
